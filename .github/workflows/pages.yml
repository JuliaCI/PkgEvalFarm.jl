# Publishes site/ (the interactive report page) to GitHub Pages. The page is
# a fixed static asset: it takes ?run=<run_id> and loads that run's
# report.json straight from the results bucket, so it deploys once per change
# here rather than once per run. Requires Pages to be enabled for the repo
# with "GitHub Actions" as the source (Settings → Pages).
name: Pages

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
