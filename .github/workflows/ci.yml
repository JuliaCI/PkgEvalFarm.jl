name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Deployment coordinates. None of these are secrets (an account id, a role ARN,
# a bucket name and a public function URL), so they live here rather than in
# repository variables — the workflow is then self-contained and a redeployment
# elsewhere is a one-file edit.
env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE: arn:aws:iam::873569884612:role/pkgeval-deploy
  LAMBDA_BUCKET: nanosoldier2-lambda
  NAME_PREFIX: pkgeval
  BROKER_URL: https://xxwaguxec43lrpm2f74o4uftmy0wbxxd.lambda-url.us-east-1.on.aws

jobs:
  test:
    name: Tests (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test services
        # moto backs the AWS integration tests; botocore is the independent
        # oracle the SigV4 signing is cross-checked against
        run: pip install 'moto[server]' botocore
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # Temporary: prints the claims GitHub actually mints, to diff against the
  # deploy role's trust policy. Safe to remove once deploys are green (the JWT
  # payload is public metadata; the signature is never printed).
  oidc-claims:
    name: Debug OIDC claims
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Decode token claims
        run: |
          tok=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$tok" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          payload="$payload$(printf '=%.0s' $(seq 0 $pad | head -c $pad))"
          echo "$payload" | base64 -d 2>/dev/null | jq '{sub, aud, repository, repository_id,
            repository_owner, job_workflow_ref, workflow_ref, event_name, ref, runner_environment}'

  build:
    name: Build Lambda bundles
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # juliac lives in the Julia install; the trim-compatible build needs
          # 1.13, which is still a prerelease — hence include-all-prereleases
          version: '1.13'
          include-all-prereleases: true
      - uses: julia-actions/cache@v2
      - name: Build broker
        run: julia --project=broker broker/build/build.jl
      - name: Build bot
        run: julia --project=bot bot/build/build.jl
      - name: Assert bundles are CPU-portable
        # juliac targets the build host unless JULIA_CPU_TARGET is set; an
        # AVX-512 build dies during Lambda init ("Rejecting this target due to
        # use of runtime-disabled features"), so fail loudly here instead
        run: |
          for app in broker bot; do
            count=$(objdump -d "$app/build/stage/bootstrap" | grep -c '%zmm' || true)
            echo "$app: $count AVX-512 instructions"
            [ "$count" -eq 0 ] || { echo "::error::$app bundle is not portable"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles
          path: |
            broker/build/bootstrap.zip
            bot/build/bootstrap.zip
          retention-days: 7

  deploy:
    name: Publish Lambda bundles
    runs-on: ubuntu-latest
    needs: build
    # only from the deploy branch of this repo — never from forks or PRs, which
    # is also what the role's OIDC `sub` condition enforces on the AWS side
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # NOTE: deliberately no `environment:` — declaring one changes the OIDC
    # `sub` claim to repo:OWNER/REPO:environment:NAME, which would no longer
    # match the role's trust policy. To add manual approval, set an environment
    # here *and* update github_deploy_subjects to the environment form.
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pkgevalfarm-deploy-${{ github.run_id }}
      - name: Upload bundles
        run: |
          aws s3 cp broker/build/bootstrap.zip "s3://${{ env.LAMBDA_BUCKET }}/broker.zip"
          aws s3 cp bot/build/bootstrap.zip "s3://${{ env.LAMBDA_BUCKET }}/bot.zip"
      - name: Publish to Lambda
        run: |
          publish() {
            name=$1; key=$2
            aws lambda get-function-configuration --function-name "$name" >/dev/null 2>&1 || {
              echo "::notice::$name does not exist (not deployed); skipping"
              return 0
            }
            aws lambda update-function-code --function-name "$name" \
              --s3-bucket "${{ env.LAMBDA_BUCKET }}" --s3-key "$key" --publish >/dev/null
            aws lambda wait function-updated --function-name "$name"
            echo "::notice::published $name"
          }
          publish "${{ env.NAME_PREFIX }}-broker" broker.zip
          publish "${{ env.NAME_PREFIX }}-bot" bot.zip
      - name: Smoke-test the broker
        # /info needs no credentials and exercises init end to end, which is
        # exactly what the CPU-target class of bug breaks
        if: env.BROKER_URL != ''
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 5 "${{ env.BROKER_URL }}/info")
          echo "$body"
          echo "$body" | grep -q client_id
