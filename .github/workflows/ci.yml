name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Deployment coordinates. None of these are secrets (an account id, a role ARN,
# a bucket name and a public function URL), so they live here rather than in
# repository variables — the workflow is then self-contained and a redeployment
# elsewhere is a one-file edit.
env:
  AWS_REGION: us-east-2
  AWS_DEPLOY_ROLE: arn:aws:iam::873569884612:role/pkgeval-deploy
  LAMBDA_BUCKET: pkgeval-lambda
  NAME_PREFIX: pkgeval
  BROKER_URL: https://pkgeval.julialang.org

jobs:
  test:
    name: Tests (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test services
        # moto backs the AWS integration tests; botocore is the independent
        # oracle the SigV4 signing is cross-checked against
        run: pip install 'moto[server]' botocore
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # Applies stay manual (tofu apply from a checkout), so this is the only
  # automated gate the terraform sees: formatting, provider-schema validation,
  # and regression guards for apply-time API limits we've hit (user-data size).
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          # no wrapper: check_userdata_size.sh captures raw `tofu console` output
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff
      - run: tofu init -backend=false -input=false
      - run: tofu validate -no-color
      - run: ./check_userdata_size.sh

  build:
    name: Build Lambda bundles
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # juliac lives in the Julia install; the trim-compatible build needs
          # 1.13, and specifically a build newer than rc1: trimmed images built
          # before JuliaLang/julia#62009 (first in rc2, unreleased as of
          # 2026-07-29) lose GC write-barrier edges on image objects and
          # segfault at runtime. The release-1.13 nightlies carry the fix;
          # switch back to '1.13' once rc2+ binaries are published.
          version: '1.13-nightly'
      - uses: julia-actions/cache@v2
      - name: Build broker
        run: julia --project=broker broker/build/build.jl
      - name: Build bot
        run: julia --project=bot bot/build/build.jl
      - name: Build build-request broker
        run: julia --project=buildreq buildreq/build/build.jl
      - name: Assert bundles are CPU-portable
        # juliac targets the build host unless JULIA_CPU_TARGET is set; an
        # AVX-512 build dies during Lambda init ("Rejecting this target due to
        # use of runtime-disabled features"), so fail loudly here instead
        run: |
          for app in broker bot buildreq; do
            count=$(objdump -d "$app/build/stage/bootstrap" | grep -c '%zmm' || true)
            echo "$app: $count AVX-512 instructions"
            [ "$count" -eq 0 ] || { echo "::error::$app bundle is not portable"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles
          path: |
            broker/build/bootstrap.zip
            bot/build/bootstrap.zip
            buildreq/build/bootstrap.zip
          retention-days: 7

  # Sysimage the workers download at boot instead of spending ~80s precompiling
  # AWS.jl, PkgEval and friends on every launch (spot replacement, scale-out,
  # scale-to-zero). Built on the same Julia *minor* the workers install and from
  # the committed Manifest, so the baked code is not stale on arrival.
  sysimage:
    name: Build worker sysimage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # must match ec2_worker_julia_channel in terraform/variables.tf
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Add swap
        # emitting and linking a ~700MB image spikes past the hosted runner's
        # RAM often enough to kill it outright ("the hosted runner lost
        # communication with the server"); swap absorbs the peak. On /mnt: the
        # runner already has an active /swapfile (small), and /mnt is the large
        # scratch disk.
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build sysimage
        run: |
          julia --project=sysimage -e 'using Pkg; Pkg.instantiate()'
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. sysimage/build.jl
      - name: Assert the sysimage is CPU-portable
        # workers are whatever the spot pool hands us (m5a/m6a/m7a...), so the
        # image must not contain instructions the oldest of them lacks. It is
        # multiversioned, unlike the juliac bundles, but the failure mode of
        # getting this wrong is the same: dead on arrival.
        run: |
          count=$(objdump -d sysimage/build/*.so | grep -c '%zmm' || true)
          echo "$count AVX-512 instructions"
          [ "$count" -eq 0 ] || { echo "::error::sysimage is not portable"; exit 1; }
      - name: Check it loads
        run: |
          julia --project=. -J sysimage/build/*.so -e '
            using PkgEvalFarm
            # the point of the exercise: nothing may be recompiled on load
            for m in (PkgEvalFarm, PkgEvalFarm.AWS, PkgEvalFarm.PkgEval)
                Base.in_sysimage(Base.PkgId(m)) ||
                    error("$m is not in the sysimage; workers would precompile it anyway")
            end'
      - uses: actions/upload-artifact@v4
        with:
          name: worker-sysimage
          path: sysimage/build/*.so
          retention-days: 7

  deploy:
    name: Publish Lambda bundles
    runs-on: ubuntu-latest
    needs: [build, sysimage]
    # only from the deploy branch of this repo — never from forks or PRs, which
    # is also what the role's OIDC `sub` condition enforces on the AWS side
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # NOTE: deliberately no `environment:` — declaring one changes the OIDC
    # `sub` claim to repo:OWNER/REPO:environment:NAME, which would no longer
    # match the role's trust policy. To add manual approval, set an environment
    # here *and* update github_deploy_subjects to the environment form.
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles
      - uses: actions/download-artifact@v4
        with:
          name: worker-sysimage
          path: sysimage
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pkgevalfarm-deploy-${{ github.run_id }}
      - name: Upload bundles
        run: |
          aws s3 cp broker/build/bootstrap.zip "s3://${{ env.LAMBDA_BUCKET }}/broker.zip"
          aws s3 cp bot/build/bootstrap.zip "s3://${{ env.LAMBDA_BUCKET }}/bot.zip"
          aws s3 cp buildreq/build/bootstrap.zip "s3://${{ env.LAMBDA_BUCKET }}/build-request.zip"
      - name: Publish to Lambda
        run: |
          publish() {
            name=$1; key=$2
            aws lambda get-function-configuration --function-name "$name" >/dev/null 2>&1 || {
              echo "::notice::$name does not exist (not deployed); skipping"
              return 0
            }
            aws lambda update-function-code --function-name "$name" \
              --s3-bucket "${{ env.LAMBDA_BUCKET }}" --s3-key "$key" --publish >/dev/null
            aws lambda wait function-updated --function-name "$name"
            echo "::notice::published $name"
          }
          publish "${{ env.NAME_PREFIX }}-broker" broker.zip
          publish "${{ env.NAME_PREFIX }}-bot" bot.zip
          publish "${{ env.NAME_PREFIX }}-build-request" build-request.zip
      - name: Publish the worker sysimage
        # Keyed by commit: a worker fetches the image built from the exact
        # revision it checked out, so code and image can never disagree (and a
        # miss just means the worker precompiles, see the cloud-init fallback).
        # The bucket policy makes these create-only -- a published image is
        # executed by every EC2 worker that boots afterwards.
        run: |
          for so in sysimage/*.so; do
            key="sysimage/${{ github.sha }}/$(basename "$so")"
            if aws s3api head-object --bucket "${{ env.LAMBDA_BUCKET }}" --key "$key" >/dev/null 2>&1; then
              echo "::notice::$key already published (re-run of the same commit)"
              continue
            fi
            # If-None-Match: * -- the bucket policy rejects any put without it
            aws s3api put-object --bucket "${{ env.LAMBDA_BUCKET }}" --key "$key" \
              --body "$so" --if-none-match '*' >/dev/null
            echo "::notice::published $key"
          done

      - name: Publish the worker deploy ref
        # the sha workers should run: written only after every bundle and the
        # sysimage for this commit are published, so a fleet generation that
        # samples it always gets CI-green code with its sysimage in place
        run: |
          aws ssm put-parameter --name /pkgeval/worker-ref --type String \
            --value "${{ github.sha }}" --overwrite

      - name: Smoke-test the broker
        # /info needs no credentials and exercises init end to end, which is
        # exactly what the CPU-target class of bug breaks
        if: env.BROKER_URL != ''
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 5 "${{ env.BROKER_URL }}/info")
          echo "$body"
          echo "$body" | grep -q client_id
