# Build-time environment for the worker sysimage: PackageCompiler *only*.
#
# The sysimage is built against the farm's own project (whose Manifest.toml is
# committed, so CI and the workers bake and load exactly the same package
# versions -- if they drifted, Julia would treat the baked code as stale and
# recompile it, silently losing the whole point). build.jl therefore keeps this
# environment out of the active project and only stacks it on LOAD_PATH.

[deps]
PackageCompiler = "9b87118b-4619-50d2-8e1e-99f35a4d4d9d"

[compat]
PackageCompiler = "2"
